name: Weekly Blog Auto-Publish

on:
  schedule:
    # Todos los viernes a las 12:00 UTC (09:00 AM hora de Chile Continental)
    - cron: '0 12 * * 5'
  workflow_dispatch:
    inputs:
      force_topic:
        description: 'Tema específico para el artículo (opcional)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  curate-and-publish:
    name: Curar y Publicar Artículo Semanal
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Configurar Entorno Python y Pillow (Compresión WebP)
        run: |
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow || true

      - name: Instalar Dependencias
        run: npm ci

      - name: Diagnóstico Pre-flight del Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY || secrets.GEMINI_API_KEY }}
        run: node scripts/preflight-check.js

      - name: Ejecutar Piloto Automático de Curaduría y Generación
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY || secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.force_topic }}" ]; then
            node scripts/auto-curate-and-publish.js --force-topic="${{ github.event.inputs.force_topic }}"
          else
            node scripts/auto-curate-and-publish.js
          fi

      - name: Instalar Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Ejecutar Pruebas Automatizadas de Calidad
        run: npx playwright test tests/blog-automation.spec.js tests/blog-image-generation.spec.js

      - name: Publicar Artículo Nuevo en Facebook (Meta Graph API)
        if: success()
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID || '386393411716633' }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          if [ -n "$FB_PAGE_ACCESS_TOKEN" ]; then
            echo "🚀 Publicando nuevo artículo semanal en Facebook..."
            node scripts/publish-facebook.js --mode=friday-new
          else
            echo "⚠️ FB_PAGE_ACCESS_TOKEN no configurado en Secrets. Generando tarjeta en modo simulación..."
            node scripts/publish-facebook.js --mode=friday-new --dry-run
          fi

      - name: Commit y Push de los Cambios Compilados a Main
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/blog/ content/ public/sitemap.xml
          if git diff --staged --quiet; then
            echo "ℹ️ No se detectaron cambios para commitear. Fin del proceso."
          else
            git commit -m "chore(blog): auto-publish weekly article [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
            echo "✅ Artículo publicado y empujado a la rama main con éxito."
          fi

      - name: Notificar Indexación Instantánea (IndexNow)
        if: success()
        run: node scripts/indexnow-notify.js

      - name: Agente Centinela de Auto-Reparación (Self-Healing)
        if: failure()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY || secrets.GEMINI_API_KEY }}
        run: |
          echo "🛡️ Activando Agente Centinela de Auto-Reparación ante fallo en el pipeline..."
          node scripts/self-heal-blog.js --ci
