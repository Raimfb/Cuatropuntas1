name: Facebook Backlog Auto-Publisher

on:
  schedule:
    # Todos los martes a las 14:00 UTC (11:00 AM hora de Chile Continental)
    - cron: '0 14 * * 2'
  workflow_dispatch:
    inputs:
      force_slug:
        description: 'Slug específico para forzar publicación (opcional)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  publish-backlog:
    name: Publicar Artículo del Backlog en Facebook
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Dependencias
        run: npm ci

      - name: Configurar Python y Pillow
        run: |
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow || true

      - name: Instalar Fuentes TrueType para Linux
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core || true

      - name: Ejecutar Publicador en Facebook
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID || '386393411716633' }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.force_slug }}" ]; then
            echo "🎯 Forzando publicación del slug: ${{ github.event.inputs.force_slug }}"
            node scripts/publish-facebook.js --slug="${{ github.event.inputs.force_slug }}"
          else
            echo "📅 Ejecutando publicación del backlog de los martes..."
            node scripts/publish-facebook.js --mode=tuesday-backlog
          fi

      - name: Commit y Push del Historial Actualizado
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add content/social/ public/blog/social/
          if git diff --staged --quiet; then
            echo "ℹ️ No hay cambios en el historial o tarjetas. Fin del proceso."
          else
            git commit -m "chore(social): update facebook feed history and card [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
            echo "✅ Historial de publicaciones sincronizado en main."
          fi
